[project]
name = "telemetrify"
version = "0.2.0"
description = "telemetrify — per-prompt telemetry capture, semantic search, and replay for Claude Code sessions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "zstandard>=0.22",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.4",
    "python-multipart>=0.0.9",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "cryptography>=42.0",
    "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telemetrify", "src/prompt_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
