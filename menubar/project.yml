name: ai-pulse
options:
  bundleIdPrefix: dev.mastropaolo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
targets:
  AIPulseCore:
    type: framework
    platform: macOS
    sources:
      - AIPulseCore/Sources
    info:
      path: AIPulseCore/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mastropaolo.ai-pulse.core
        DEFINES_MODULE: YES

  AIPulseApp:
    type: application
    platform: macOS
    sources:
      - AIPulseApp/Sources
      - AIPulseApp/Resources/Assets.xcassets
    info:
      path: AIPulseApp/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleName: "AI-Pulse"
        CFBundleDisplayName: "AI-Pulse"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Antonio Mastropaolo"
    dependencies:
      - target: AIPulseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mastropaolo.ai-pulse
        PRODUCT_NAME: AI-Pulse
        INFOPLIST_FILE: AIPulseApp/Info.plist

  AIPulseCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AIPulseCoreTests
        excludes:
          - "Fixtures/**"
      - path: AIPulseCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AIPulseCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mastropaolo.ai-pulse.core.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIPulseCore:
    build:
      targets:
        AIPulseCore: all
        AIPulseCoreTests: [test]
    test:
      targets:
        - AIPulseCoreTests
  AIPulseApp:
    build:
      targets:
        AIPulseApp: all
    run:
      config: Debug
