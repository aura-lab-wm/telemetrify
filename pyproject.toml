[project]
name = "prompt-telemetry"
version = "0.1.0"
description = "Per-prompt telemetry capture and semantic search for Claude Code sessions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1.6",
    "zstandard>=0.22",
    "hdbscan>=0.8.40",
    "scikit-learn>=1.4",
    "python-multipart>=0.0.9",
    "pywebpush>=2.0",
    "py-vapid>=1.9",
    "cryptography>=42.0",
    "anthropic>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_telemetry"]
